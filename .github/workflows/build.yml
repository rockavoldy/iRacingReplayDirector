name: Build

# Auto-build the iRacing Automated Replay Director (WPF / .NET Framework 4.8).
#
# The app references the iRacing SDK wrapper, which is a git submodule
# (rockavoldy/iRacingSdkWrapper) checked out at external/iRacingSdkWrapper and built
# as part of this solution via ProjectReference. No pre-built DLLs are required.
#
# The wrapper projects are SDK-style and target net48 (iRSDKSharp also multi-targets
# netstandard2.0). They pull their dependencies (Microsoft.NETFramework.ReferenceAssemblies,
# YamlDotNet) via PackageReference, and the app itself targets net48 to match.

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  SOLUTION: ReplayTimeline.sln
  CONFIGURATION: Release
  # The solution/project configurations are named "Any CPU" (with a space).
  PLATFORM: Any CPU

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      # The SDK wrapper is a submodule, so check out submodules recursively.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # No retargeting is needed: the wrapper submodule (rockavoldy/iRacingSdkWrapper)
      # ships SDK-style projects targeting net48 and restores the .NET Framework
      # reference assemblies from NuGet (Microsoft.NETFramework.ReferenceAssemblies),
      # so the legacy-framework MSB3644 failure no longer applies.

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
            external/iRacingSdkWrapper/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Restore the app's packages.config (Newtonsoft.Json).
      - name: Restore packages.config (app)
        run: nuget restore ${{ env.SOLUTION }}

      # Restore PackageReference dependencies of the SDK-style wrapper projects
      # (Microsoft.NETFramework.ReferenceAssemblies, YamlDotNet) and generate their
      # project.assets.json. nuget restore does not handle PackageReference.
      - name: Restore PackageReference (SDK-style wrapper)
        run: >
          msbuild ${{ env.SOLUTION }}
          -t:Restore
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform="${{ env.PLATFORM }}"
          /verbosity:minimal

      # The solution includes the wrapper projects via ProjectReference, so this
      # builds the wrapper and the app together.
      - name: Build solution (Release)
        run: >
          msbuild ${{ env.SOLUTION }}
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform="${{ env.PLATFORM }}"
          /m
          /verbosity:minimal

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "ReplayTimeline/bin/Release/iRacingSequenceDirector.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Expected output not found: $exe"
            exit 1
          }

          # The wrapper DLLs and their transitive dependency must be copied next to the exe.
          $required = @(
            "iRacingSdkWrapper.dll",
            "iRacingSimulator.dll",
            "iRSDKSharp.dll",
            "YamlDotNet.dll",
            "Newtonsoft.Json.dll"
          )
          $missing = @()
          foreach ($dll in $required) {
            if (-not (Test-Path "ReplayTimeline/bin/Release/$dll")) { $missing += $dll }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Missing dependency DLLs in output: $($missing -join ', ')"
            exit 1
          }

          Get-ChildItem ReplayTimeline/bin/Release | Select-Object Name, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRacingSequenceDirector-${{ github.sha }}
          path: ReplayTimeline/bin/Release
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: iRacingSequenceDirector-${{ github.sha }}
          path: dist

      - name: Package release zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath "iRacingSequenceDirector-${{ github.ref_name }}.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: iRacingSequenceDirector-${{ github.ref_name }}.zip
          generate_release_notes: true
